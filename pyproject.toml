[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-socket-server"
description = "Simple TCP socket server with select"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [
    { name = "webtoucher", email = "webtoucher@ya.ru" },
]
keywords = ["socket", "tcp", "server", "select", "networking", "event-driven"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "event-bus~=1.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/webtoucher/simple-socket-server"
Repository = "https://github.com/webtoucher/simple-socket-server"
Issues = "https://github.com/webtoucher/simple-socket-server/issues"
Changelog = "https://github.com/webtoucher/simple-socket-server/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["simple_socket_server"]

[tool.setuptools.dynamic]
version = { attr = "simple_socket_server.__version__" }

[tool.setuptools.package-data]
simple_socket_server = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
